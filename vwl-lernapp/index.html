<title>VWL Kurzarbeit Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single column app shell; sticky top bar; topic tiles -> reader -> quiz cards like a driving-theory trainer */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E3E9EC; --ink:#11262E; --muted:#5A6B72; --line:#CCD6DA;
  --accent:#0B6E7A; --accent-ink:#FFFFFF; --accent-soft:#D5ECEE;
  --ok:#1E8A4C; --ok-soft:#DDF2E5; --warn:#C98A06; --warn-soft:#FBF0D3; --bad:#C2372E; --bad-soft:#FBE1DE; --new:#9AA8AE;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A1F; --surface:#15252B; --surface-2:#1C3038; --ink:#E5EEF0; --muted:#94A7AD; --line:#2A4049;
  --accent:#3FB6C3; --accent-ink:#06191D; --accent-soft:#16383E;
  --ok:#4CC27E; --ok-soft:#163A26; --warn:#E8B23A; --warn-soft:#3A2F12; --bad:#EE6B60; --bad-soft:#40201D; --new:#5D7279; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1F; --surface:#15252B; --surface-2:#1C3038; --ink:#E5EEF0; --muted:#94A7AD; --line:#2A4049;
  --accent:#3FB6C3; --accent-ink:#06191D; --accent-soft:#16383E;
  --ok:#4CC27E; --ok-soft:#163A26; --warn:#E8B23A; --warn-soft:#3A2F12; --bad:#EE6B60; --bad-soft:#40201D; --new:#5D7279; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ans:focus-within,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.top .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.ghost:hover{background:var(--surface-2)}

main{padding-block:24px 64px}
.view{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:0;max-width:62ch}

/* overall progress */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.02em}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.big{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.actions{grid-template-columns:1fr}}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.act:hover{border-color:var(--accent)}
.act b{font-family:var(--f-display);font-size:17px}
.act small{color:var(--muted);font-size:13px}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act.primary small{color:inherit;opacity:.85}
.act[disabled]{opacity:.5;cursor:not-allowed}

.topics{display:flex;flex-direction:column;gap:10px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:start}
.topic .num{grid-row:span 3;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:800;font-size:20px;display:grid;place-items:center}
.topic h3{font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.tag.read{background:var(--ok-soft);color:var(--ok)}
.topic .meta{display:flex;align-items:center;gap:10px;min-width:0}
.topic .meta .bar{flex:1;height:8px}
.topic .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.lg{padding:12px 20px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* reader */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,32px)}
.reader h2{font-size:clamp(24px,4.5vw,30px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.reader h4{font-family:var(--f-display);font-size:17px;margin:26px 0 8px}
.reader p,.reader li{max-width:65ch}
.reader ul{padding-left:20px;margin:6px 0}
.reader li{margin:4px 0}
.reader li::marker{color:var(--accent)}
.merke{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin:14px 0}
.merke::before{content:"Merke";display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:2px}
.f{font-family:var(--f-mono);font-size:14px;background:var(--surface-2);padding:2px 6px;border-radius:5px;white-space:normal}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--surface-2);font-weight:600}
.tbl td:first-child{font-weight:600;color:var(--muted)}
.num-t{font-variant-numeric:tabular-nums}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.pair>div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.pair b{display:block;font-family:var(--f-display)}
.nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .big{font-size:14px}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card .qtop{padding:18px 20px 6px;display:flex;flex-direction:column;gap:6px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.qtext{font-size:clamp(18px,3.4vw,21px);font-weight:600;line-height:1.35;margin:0}
.hint{font-size:13px;color:var(--muted)}
.answers{display:flex;flex-direction:column;gap:8px;padding:12px 20px 20px}
.ans{display:grid;grid-template-columns:32px 1fr 24px;gap:12px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface);transition:border-color .12s, background .12s}
.ans:hover{border-color:var(--accent)}
.ans input{position:absolute;opacity:0;pointer-events:none}
.ans .letter{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:14px}
.ans.sel{border-color:var(--accent);background:var(--accent-soft)}
.ans.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ans .res{font-weight:800;text-align:center}
.locked .ans{cursor:default}
.locked .ans:hover{border-color:var(--line)}
.ans.right{border-color:var(--ok);background:var(--ok-soft)}
.ans.right .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.missed{border-color:var(--ok);border-style:dashed}
.ans.missed .letter{border-color:var(--ok);color:var(--ok)}
.feedback{margin:0 20px 20px;border-radius:10px;padding:12px 16px}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback>b:first-child{display:block;font-family:var(--f-display);font-size:17px}
.feedback.ok>b:first-child{color:var(--ok)}.feedback.bad>b:first-child{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-size:12px;color:var(--muted)}
@media (max-width:560px){.kbd{display:none}}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}
.grid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-family:var(--f-mono);font-size:13px}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.confirm{background:var(--warn-soft);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.result .score{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,10vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.stamp{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:6px;border:2px solid}
.stamp.pass{color:var(--ok);border-color:var(--ok)}
.stamp.fail{color:var(--bad);border-color:var(--bad)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px}
.rv p{margin:4px 0}
.rv .c{color:var(--ok);font-weight:600}
.rv .e{color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px}
.danger{color:var(--bad);border-color:var(--bad)}
.foot{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* --- neue Aufgabentypen --- */
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.steps li{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);counter-increment:s}
.steps li b{display:block;color:var(--ink);font-family:var(--f-display);font-size:15px}
.steps li b::before{content:counter(s) " ";color:var(--accent)}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kinds .btn small{color:var(--muted);font-weight:500;margin-left:4px}
.cloze{padding:12px 20px 20px;font-size:17px;line-height:2.3;margin:0}
.gap{font:inherit;font-size:16px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:2px 6px;border-radius:4px 4px 0 0;max-width:100%;line-height:1.4}
.gap:focus{outline:none;background:var(--surface-2)}
.blank{padding:2px 6px;border-radius:4px;font-weight:600}
.blank.ok{background:var(--ok-soft);color:var(--ok)}
.blank.bad{background:var(--bad-soft);color:var(--ok)}
.blank.bad s{color:var(--bad);font-weight:500;margin-right:6px}
.calc{padding:12px 20px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc input{font-family:var(--f-mono);font-size:20px;width:170px;max-width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.calc input:focus{outline:none;border-color:var(--accent)}
.calc .unit{font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.calc input.ok{border-color:var(--ok);background:var(--ok-soft)}
.calc input.bad{border-color:var(--bad);background:var(--bad-soft)}
.sortlist,.ordlist{padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px}
.srow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chip.should{border-color:var(--ok);color:var(--ok);border-style:dashed}
.locked .chip{cursor:default}
.orow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.orow .pos{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px}
.orow small{display:block;color:var(--muted);font-size:12px}
.mv{display:flex;gap:4px}
.mv button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.mv button:hover:not([disabled]){background:var(--surface-2)}
.mv button[disabled]{opacity:.35;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-soft)}
.orow.bad{border-color:var(--bad);background:var(--bad-soft)}
.writebox{padding:12px 20px 20px;display:flex;flex-direction:column;gap:12px}
.writebox textarea{width:100%;min-height:160px;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}
.writebox textarea:focus{outline:none;border-color:var(--accent)}
.writebox textarea[disabled]{opacity:.85}
.model{background:var(--accent-soft);border-radius:10px;padding:12px 16px}
.lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.checklist{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.checklist input{width:20px;height:20px;accent-color:var(--ok);margin-top:2px;flex:none}
.checklist .auto{font-size:12px;color:var(--muted)}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:28px 20px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%}
.flash .front{font-family:var(--f-display);font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.2}
.flash .back{font-size:17px;max-width:52ch;border-top:1px solid var(--line);padding-top:14px}
.flash .tap{color:var(--muted);font-size:13px}
.flash.flipped{border-color:var(--accent)}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcbtns .no-btn{border-color:var(--bad);color:var(--bad)}
.fcbtns .yes-btn{background:var(--ok);border-color:var(--ok);color:#fff}
.feedback.part{background:var(--warn-soft)}
.feedback.part>b:first-child{color:var(--warn)}
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" id="home-btn" type="button"><span class="mark">€</span>VWL-Trainer</button>
    <span class="sp"></span>
    <button class="ghost" id="nav-home" type="button">Übersicht</button>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* ---------------- LERNINHALTE ---------------- */
const TOPICS = [
{ id:"t1", title:"Magisches Sechseck", star:true, html:`
<p class="lead">Grundlage ist das <b>Stabilitätsgesetz von 1967 (§1 StabG)</b>. Ursprünglich gab es vier Ziele, das <b>magische Viereck</b>.</p>
<h4>Die 4 Ziele aus dem Stabilitätsgesetz</h4>
<ul><li>Hoher Beschäftigungsstand</li><li>Stabiles Preisniveau</li><li>Außenwirtschaftliches Gleichgewicht</li><li>Stetiges, angemessenes Wirtschaftswachstum</li></ul>
<h4>+ 2 Ziele, die später dazukamen → Sechseck</h4>
<ul><li>Gerechte Einkommens- &amp; Vermögensverteilung</li><li>Schutz der natürlichen Umwelt</li></ul>
<div class="merke">„Magisch“, weil <b>nicht alle Ziele gleichzeitig erreichbar</b> sind. Das wäre wie Zauberei.</div>
<h4>Zielkonflikte</h4>
<ul>
<li><b>Wachstum ↔ Umweltschutz</b>: mehr Produktion → mehr Ressourcenverbrauch / CO₂</li>
<li><b>Vollbeschäftigung ↔ Preisstabilität</b>: mehr Jobs → mehr Nachfrage → Preise ↑</li>
<li><b>Wachstum ↔ Preisstabilität</b>: Boom → Inflation</li>
<li><b>Außenhandelsüberschuss ↔ Preisstabilität</b>: Nachfrage aus dem Ausland → Preise ↑</li></ul>
<h4>Zielharmonie</h4>
<ul><li><b>Wachstum ↔ Beschäftigung</b>: mehr Produktion → mehr Jobs</li></ul>`},
{ id:"t2", title:"Ziele & Zielerreichung in Deutschland", html:`
<p class="lead">Jedes Ziel wird über einen Indikator gemessen. 2019–2025 hat Deutschland keines der vier Ziele dauerhaft erreicht.</p>
<div class="tbl"><table><thead><tr><th>Ziel</th><th>Indikator</th><th>Zielwert</th><th>2019–2025</th><th>erreicht?</th></tr></thead><tbody>
<tr><td>Beschäftigung</td><td>Arbeitslosenquote</td><td class="num-t">&lt; 3 %</td><td class="num-t">5,0–6,3 % (↑)</td><td class="no">nein</td></tr>
<tr><td>Wachstum</td><td>BIP-Wachstum</td><td class="num-t">2–3 %</td><td class="num-t">−4,1 bis 3,9 %</td><td class="no">nein (nur 2021)</td></tr>
<tr><td>Preisniveau</td><td>Inflationsrate (VPI)</td><td class="num-t">knapp &lt; 2 %</td><td class="num-t">0,5–6,9 %</td><td class="no">nein (2022: 6,9)</td></tr>
<tr><td>Außenwirtschaft</td><td>Außenbeitragsquote</td><td class="num-t">1–2 %</td><td class="num-t">2,5–5,6 %</td><td class="no">nein (zu hoch)</td></tr>
</tbody></table></div>
<h4>Kritik an den Indikatoren</h4>
<ul>
<li><b>ALQ</b>: Personen in privater Vermittlung, Umschulung/Weiterbildung, 1-€-Jobber und „Unvermittelbare“ fehlen. Ältere fehlen auch → Quote ist <b>zu niedrig</b>.</li>
<li><b>BIP</b>: soziale Kosten und Umweltzerstörung fehlen.</li>
<li><b>Inflation</b>: gefühlte ≠ gemessene Inflation. Der Warenkorb ist nach <b>Anteil am Einkommen</b> gewichtet, nicht nach Kaufhäufigkeit → teure, selten gekaufte Güter sind überbewertet.</li>
<li><b>Außenhandelsüberschuss</b>: „Beggar-thy-Neighbor“ → Jobs und Wohlstand im Inland auf Kosten des Auslands.</li></ul>
<h4>Formeln</h4>
<ul>
<li><span class="f">ALQ = Arbeitslose ÷ (Arbeitslose + Erwerbstätige) × 100</span></li>
<li><span class="f">BIP = Produktionswert − Vorleistungen + (Gütersteuern − Subventionen)</span></li>
<li><span class="f">Inflation = (Warenkorb neu − Warenkorb alt) ÷ Warenkorb alt × 100</span></li>
<li><span class="f">Außenbeitragsquote = (Exporte − Importe) ÷ BIP × 100</span></li>
<li><span class="f">Außenhandelsüberschuss = Exporte − Importe</span></li></ul>`},
{ id:"t3", title:"Konjunkturzyklus", html:`
<p class="lead">Ablauf: <b>Aufschwung → Hochkonjunktur → Abschwung (Rezession) → Depression</b> → wieder Aufschwung …</p>
<h4>Kennzeichen der Phasen</h4>
<ul>
<li><b>Aufschwung</b>: Nachfrage ↑, Investitionen ↑, Produktion ↑, ALQ sinkt, Optimismus</li>
<li><b>Hochkonjunktur (Boom)</b>: Kapazitäten voll ausgelastet, fast Vollbeschäftigung, Preise/Löhne/Zinsen ↑</li>
<li><b>Abschwung</b>: Nachfrage ↓, Lager voll, Investitionen ↓, ALQ ↑</li>
<li><b>Depression</b>: hohe ALQ, Insolvenzen ↑, niedrige Zinsen, Pessimismus</li></ul>
<div class="pair">
<div><b>Boom → Abschwung</b>Löhne/Preise/Zinsen ↑ → Kosten ↑ → Gewinne ↓<br>Inflation → Kaufkraft ↓ → Nachfrage ↓<br>Überkapazitäten → Investitionen ↓ → Entlassungen</div>
<div><b>Tief → Aufschwung</b>Niedrige Zinsen → günstige Kredite<br>Notwendige Ersatzinvestitionen, leere Lager → Optimismus</div></div>
<h4>Konjunkturindikatoren</h4>
<ul>
<li><b>Frühindikatoren</b>: Lagerbestände, Auftragseingänge, Gewinnerwartungen, Investitionsabsichten, Aktienindex</li>
<li><b>Gegenwartsindikatoren</b>: Sparquote, reales BIP, Konsumausgaben, Auslastung des Produktionspotenzials, Kreditnachfrage</li>
<li><b>Spätindikatoren</b>: Insolvenzen, ALQ, Steuereinnahmen, Preise, Löhne, Inflationsrate</li></ul>
<div class="merke">Deutschland 2015 = <b>Aufschwung</b>: Konsum &amp; Investitionen ↑, ALQ niedrig/sinkend. Aber keine Vollbeschäftigung → noch keine Hochkonjunktur.</div>`},
{ id:"t4", title:"Konjunkturtheorien", html:`
<ul>
<li><b>Unterkonsumtionstheorien</b>: Konsum zu gering, Löhne steigen langsamer als die Produktion, Reiche sparen mehr.</li>
<li><b>Monetäre Theorien</b>: Geldmenge steuert → billige Kredite → Aufschwung → Preise ↑ → Zentralbank bremst → Abschwung.</li>
<li><b>Überinvestitionstheorien</b>: zu viel investiert → Überproduktion, Angebot &gt; Nachfrage → Überkapazitäten werden abgebaut.</li>
<li><b>Exogene Theorien</b>: Ursachen von außen, z. B. Krieg, Naturkatastrophen, Wahlen, Stimmung.</li>
<li><b>Mathematische Modelle</b>: Konjunktur wird rechnerisch erklärt.</li></ul>
<div class="merke">Fazit: Konjunkturanalyse ist „Glaubenssache“. Es gibt zu viele Faktoren → präzise Prognosen sind kaum möglich.</div>`},
{ id:"t5", title:"Nachfrage- vs. Angebotspolitik", hot:true, html:`
<div class="tbl"><table><thead><tr><th></th><th>Nachfragepolitik</th><th>Angebotspolitik</th></tr></thead><tbody>
<tr><td>Ursprung</td><td>Keynes (Keynesianismus), Weltwirtschaftskrise 1930er</td><td>Neoklassik, Monetarismus nach Friedman (1970er)</td></tr>
<tr><td>Staat</td><td>greift aktiv ein, Finanzpolitik</td><td>möglichst wenig Eingriffe</td></tr>
<tr><td>Ziel</td><td>Konsumkraft ↑ → Nachfrage ↑</td><td>Produktionsbedingungen ↑ → Angebot ↑</td></tr>
<tr><td>Markt</td><td>instabil</td><td>stabil</td></tr>
<tr><td>Warum?</td><td>kurzfristig: unsichere Erwartungen; langfristig: Einkommen konzentriert sich → mehr Sparen</td><td>kurzfristig: Say'sches Theorem („Jedes Angebot schafft sich seine Nachfrage“); langfristig: Innovationen</td></tr>
<tr><td>Investitionen hängen ab von</td><td>erwarteten Gewinnen bzw. erwarteter Konsumnachfrage</td><td>realen Gewinnen bzw. Vermögen</td></tr>
<tr><td>Grund für Tiefphasen</td><td>Konsumnachfrage ↓</td><td>schlechte Rahmenbedingungen, Regulierung</td></tr>
<tr><td>Ansatz</td><td>antizyklisch</td><td>Ordnungspolitik (Rahmenbedingungen schaffen)</td></tr>
</tbody></table></div>
<h4>Maßnahmen Nachfragepolitik</h4>
<ul>
<li><b>Tiefphase</b>: Staatsausgaben ↑ (auf Kredit, z. B. Straßenbau, Stromtrassen), Löhne/Subventionen/Prämien ↑, Steuern/Zinsen ↓</li>
<li><b>Hochphase</b>: Staatsausgaben/Subventionen/Prämien ↓, Steuern/Zinsen ↑, Kredite tilgen, Rücklagen bilden</li></ul>
<h4>Maßnahmen Angebotspolitik</h4>
<ul><li>Staatskonsum ↓, keine bzw. kaum Neuverschuldung</li><li>Deregulierung, Unternehmenssteuern ↓</li><li>Investitionen &amp; Innovationen fördern</li><li>Wettbewerb fördern (weniger Subventionen und Monopole)</li><li>Lohnmäßigung (z. B. kein Mindestlohn)</li><li>Privaten Sektor ausweiten</li></ul>
<h4>Kritik</h4>
<div class="pair">
<div><b>an der Nachfragepolitik</b>Kredite → Zinsen ↑ → private Investitionen ↓ (<b>Crowding-out</b>)<br>Staat reagiert zu langsam (<b>Time-lags</b>) → wirkt prozyklisch statt antizyklisch<br>Schulden werden im Boom nicht abgebaut → Staatsverschuldung ↑</div>
<div><b>an der Angebotspolitik</b>Geht zulasten der Arbeitnehmer → Löhne ↓ → Konsum ↓<br>Inlandsnachfrage schwach → Exportfokus → Druck auf andere Länder → globale Nachfrageschwäche (Teufelskreis)</div></div>
<h4>Chancen und Risiken</h4>
<ul>
<li><b>Nachfragepolitik</b>: Chance: fängt Schwankungen ab. Risiko: Fehler des Staates → schlimmere Rezession.</li>
<li><b>Angebotspolitik</b>: Chance: Wirtschaft entwickelt sich frei. Risiko: kein Eingriff → schwere Rezessionen.</li></ul>
<h4>Zuordnung der Positionen</h4>
<ul>
<li><b>Nachfragepolitik</b>: Volkseinkommen und Arbeitsmarkt werden durch die Nachfrage bestimmt; Staat greift ein „so viel wie nötig“; Staat muss Vollbeschäftigung sichern.</li>
<li><b>Angebotspolitik</b>: privater Sektor ist stabil; keine Konjunkturpolitik nötig; Markt schafft Vollbeschäftigung; beste Investitionsbedingungen; Staat greift „so wenig wie möglich“ ein; Unternehmen investieren nur bei Absatz.</li></ul>
<div class="merke">Angebotspolitik = <b>Trickle-Down-Effekt</b>, Investitionen als Motor.<br>Nachfragepolitik = <b>Nachfrage bestimmt das Angebot</b>.</div>
<h4>Textaufgabe Wirtschaftsprogramm</h4>
<p>Investitionen in Infrastruktur, Bildung und Forschung ↑, <b>keine neuen Schulden</b> → <b>angebotsorientiert</b>.</p>`},
{ id:"t6", title:"Arbeitslosigkeit & Messung", html:`
<ul>
<li><span class="f">ALQ = Arbeitslose × 100 ÷ (Erwerbstätige + Arbeitslose)</span></li>
<li>Gezählt werden nur <b>unfreiwillig</b> Arbeitslose.</li>
<li>Freiwillig arbeitslos (nicht gezählt): Studenten, Rentner, Kindererziehung.</li>
<li>Die ALQ zeigt <b>weniger</b> als tatsächlich.</li>
<li><span class="f">Arbeitsangebot = Erwerbstätige + Arbeitslose</span></li>
<li><span class="f">Arbeitsnachfrage = Erwerbstätige + offene Stellen</span></li></ul>
<h4>Weitere Größen</h4>
<ul>
<li>Erwerbstätige ↑ → mehr Beschäftigung (<span class="f">Erwerbsquote = Erwerbspersonen ÷ Bevölkerung</span>)</li>
<li>Kurzarbeit ↓ → positiv für den Arbeitsmarkt</li>
<li>Offene Stellen ↑ → positiv für den Arbeitsmarkt</li></ul>
<h4>„Arbeitslos“ laut Bundesagentur für Arbeit (§16 SGB III)</h4>
<ul><li>Mindestens 15 Jahre alt</li><li>Beschäftigungslos oder unter 15 Wochenstunden</li><li>Sucht versicherungspflichtige Arbeit (ab 15 Stunden pro Woche)</li><li>Arbeitslos gemeldet</li><li>Steht der Vermittlung zur Verfügung</li><li>Nicht arbeitsunfähig krank</li></ul>
<h4>Nicht als arbeitslos gezählt</h4>
<ul><li>Teilnehmer an Maßnahmen (Umschulung)</li><li>Über 58-Jährige ohne Jobangebot</li><li>Aufstocker (ab 15 Stunden Arbeit)</li><li>Personen, die Kinder erziehen, Angehörige pflegen oder zur Schule gehen</li></ul>
<h4>M3 – Jugendarbeitslosigkeit EU (August 2025, 15–24 Jahre)</h4>
<ul>
<li>Höchste: Estland 25,4 %, Schweden 24,4 %, Rumänien 23,5 %</li>
<li>EU-27: 14,6 %, Eurozone: 14 %</li>
<li>Niedrigste: <b>Deutschland 6,5 %</b> → steht solide da</li>
<li>Äußere Einflüsse wie Corona und der Ukraine-Krieg spielen eine Rolle, besonders in den Eurokrisenländern (Griechenland, Portugal, Spanien).</li></ul>`}

{t:"t2",name:"ALQ",gen(){const a=rd(1.8,3.2),e=rd(40,46),x=r1(a/(a+e)*100);

 sol:`ALQ = ${de(a)} ÷ (${de(a)} + ${de(e)}) × 100 ≈ ${de(x)} %. Zielwert unter 3 % → nicht erreicht.`};}},
{t:"t2",name:"Inflation",gen(){const alt=ri(380,620),p=rd(.8,7.5),neu=Math.round(alt*(1+p/100)),x=r1((neu-alt)/alt*100);

 sol:`(${neu} − ${alt}) ÷ ${alt} × 100 ≈ ${de(x)} %. Zielwert knapp unter 2 % → ${x<2?"erreicht":"nicht erreicht"}.`};}},

/* ---------------- TEXT-VERGLEICH ---------------- */
const norm=s=>String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[–—]/g,"-");
const tight=s=>norm(s).replace(/,/g,".").replace(/[^a-z0-9.]/g,"");
function lev(a,b){const m=a.length,n=b.length; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c;} return p[n];}
function textMatch(input,answers){const x=tight(input); if(!x) return false;
  return answers.some(a=>{const y=tight(a); if(x===y) return true; const tol=y.length>=10?2:y.length>=6?1:0; return tol>0&&lev(x,y)<=tol;});}
function parseNum(s){s=String(s).trim().replace(/\s/g,"").replace(/%|€|mrd\.?|mio\.?/gi,"");
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,""); return parseFloat(s.replace(",","."));}

  bind(it,rr){app.querySelectorAll(".ans input").forEach(inp=>inp.onchange=()=>{const ai=+inp.dataset.ai; inp.checked?it.s.sel.add(ai):it.s.sel.delete(ai); rr();});},

},

  prep(q){const parts=q.text.split(/\[\[(.+?)\]\]/); return {parts,vals:parts.filter((_,i)=>i%2).map(()=>"")};},

  bind(it,rr,changed){const t=app.querySelector("#w-in"); if(t&&!t.disabled){t.oninput=()=>{it.s.text=t.value; changed();};}
    app.querySelectorAll(".checklist input").forEach(c=>c.onchange=()=>{it.s.ticks[+c.dataset.k]=c.checked; rr();});},
  onCheck(it){const x=norm(it.s.text); it.s.auto=it.q.pts.map(p=>p[1].some(k=>x.includes(norm(k)))); it.s.ticks=it.s.auto.slice();},
  ready:()=>true, answered:it=>it.s.text.trim()!=="",
  score:it=>it.s.ticks?it.s.ticks.filter(Boolean).length/it.s.ticks.length:0,
  pass:it=>H.write.score(it)>=2/3-1e-9,
  explain:()=>"", solution:it=>esc(it.q.model)
}};
const pass=it=>(H[it.q.kind].pass||(x=>H[x.q.kind].score(x)===1))(it);
const prepare=q=>({q,s:H[q.kind].prep(q),checked:false,recorded:false});

/* ---------------- HOME ---------------- */
function home(){
  view=null;
  const c=counts(ALL), wrong=TASKS.filter(q=>status(q.id)===1).length;
  const last=S.exams[S.exams.length-1];
  app.innerHTML=`<div class="view">
  <section class="hero">
    <span class="eyebrow">Spickzettel VWL · Kurzarbeit</span>
    <h1>Erst lernen, dann abfragen lassen.</h1>
    <ol class="steps">
      <li><b>Lesen</b>Ein Thema einmal durchgehen</li>
      <li><b>Karteikarten</b>Begriffe aus dem Kopf abrufen</li>
      <li><b>Üben</b>Ankreuzen, Lücken, Rechnen, Zuordnen, Erklären</li>
      <li><b>Fehler</b>Am nächsten Tag wiederholen</li>
      <li><b>Prüfung</b>Kurz vor der Klausur simulieren</li>
    </ol>
    ${barHTML(c)}
    <div class="legend">${[3,2,1,0].map(k=>`<span><i style="background:${COLORS[k]}"></i>${c[k]} ${LABELS[k]}</span>`).join("")}</div>
    <span class="big">${c[3]} von ${ALL.length} Aufgaben sicher (2× hintereinander richtig)${last?` · letzte Prüfung: ${last.score}/${last.n} ${last.score/last.n>=.8?"bestanden":"nicht bestanden"}`:""}</span>
  </section>
  <div class="actions">
    <button class="act primary" id="go-mix"><b>Gemischtes Training</b><small>15 Aufgaben, alle Typen, Unsicheres zuerst</small></button>
    <button class="act" id="go-wrong" ${wrong?"":"disabled"}><b>Fehler wiederholen</b><small>${wrong?wrong+" falsch gelöste Aufgaben":"Gerade keine Fehler"}</small></button>
    <button class="act" id="go-exam"><b>Prüfungssimulation</b><small>20 Aufgaben · bestanden ab 80 %</small></button>
  </div>
  <span class="eyebrow">Nach Aufgabentyp üben</span>
  <div class="kinds">${Object.keys(KINDS).map(k=>`<button class="btn" data-kind="${k}">${KINDS[k]}<small>${ALL.filter(x=>x.kind===k).length}</small></button>`).join("")}</div>
  <span class="eyebrow">Themen</span>
  <div class="topics">${TOPICS.map((t,i)=>{const all=ALL.filter(q=>q.t===t.id), tc=counts(all), nt=all.filter(x=>x.kind!=="fc").length, nf=all.length-nt;
    return `<article class="topic"><div class="num">${i+1}</div>
    <h3>${t.title}${t.hot?' <span class="tag">Schwerpunkt</span>':""}${t.star?' <span class="tag">wichtig</span>':""}${S.read[t.id]?' <span class="tag read">gelesen</span>':""}</h3>
    <div class="meta">${barHTML(tc)}<span class="big">${tc[3]}/${all.length}</span></div>
    <div class="btns"><button class="btn" data-learn="${t.id}">Lernen</button><button class="btn" data-fc="${t.id}">${nf} Karteikarten</button><button class="btn solid" data-practice="${t.id}">${nt} Aufgaben üben</button></div></article>`;}).join("")}</div>
  <div class="foot">Dein Fortschritt wird nur in diesem Browser gespeichert. <button class="ghost ${resetArmed?"danger":""}" id="reset">${resetArmed?"Wirklich alles zurücksetzen?":"Fortschritt zurücksetzen"}</button></div>
  </div>`;
  app.querySelector("#go-mix").onclick=()=>practice(shuffle(rankSort(TASKS).slice(0,15)),"Gemischtes Training",true);
  app.querySelector("#go-wrong").onclick=()=>wrong&&practice(TASKS.filter(q=>status(q.id)===1),"Fehler wiederholen");
  app.querySelector("#go-exam").onclick=exam;
  app.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind, list=ALL.filter(x=>x.kind===k); k==="fc"?flash(list,"Alle Karteikarten"):practice(list,KINDS[k]);});
  app.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>learn(b.dataset.learn));
  app.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{const t=TOPICS.find(x=>x.id===b.dataset.fc); flash(FLASH.filter(q=>q.t===t.id),t.title);});
  app.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>{const t=TOPICS.find(x=>x.id===b.dataset.practice); practice(TASKS.filter(q=>q.t===t.id),t.title);});
  app.querySelector("#reset").onclick=()=>{if(!resetArmed){resetArmed=true;home();return;} S={st:{},read:{},exams:[]};save();resetArmed=false;home();};
  resetArmed=false;
}

/* ---------------- LEARN ---------------- */
function learn(id){
  view=null;
  const i=TOPICS.findIndex(t=>t.id===id), t=TOPICS[i], next=TOPICS[i+1];
  S.read[id]=true; save();
  app.innerHTML=`<div class="view">
  <article class="reader"><span class="eyebrow">Thema ${i+1} von ${TOPICS.length}</span><h2>${t.title}</h2>${t.html}</article>
  <div class="nav-row">
    <button class="btn" id="back">Zur Übersicht</button>
    <span style="display:flex;gap:8px;flex-wrap:wrap">${next?`<button class="btn" id="next">Weiter: ${next.title}</button>`:""}
    <button class="btn" id="fc">Karteikarten</button><button class="btn solid" id="quiz">Jetzt abfragen</button></span>
  </div></div>`;
  scrollTo(0,0);
  app.querySelector("#back").onclick=home;
  if(next) app.querySelector("#next").onclick=()=>learn(next.id);
  app.querySelector("#fc").onclick=()=>flash(FLASH.filter(q=>q.t===id),t.title);
  app.querySelector("#quiz").onclick=()=>practice(TASKS.filter(q=>q.t===id),t.title);
}

/* ---------------- KARTEIKARTEN-MODUS ---------------- */
function flash(list,title){
  if(!list.length) return home();
  view={mode:"fc",title,items:rankSort(list),i:0,flipped:false,known:0,missed:[]};
  renderFlash();
}
function renderFlash(){
  const v=view,c=v.items[v.i],n=v.items.length,st=status(c.id),t=TOPICS.find(x=>x.id===c.t);
  app.innerHTML=`<div class="view">
  <div class="qhead"><span class="eyebrow">Karteikarten · ${esc(v.title)}</span><span class="big">Karte ${v.i+1} / ${n} · ${v.known} gewusst</span></div>
  <div class="prog"><span style="width:${v.i/n*100}%"></span></div>
  <button type="button" class="flash ${v.flipped?"flipped":""}" id="card">
    <span class="qmeta"><span class="dot" style="background:${COLORS[st]}"></span>${LABELS[st]} · ${t.title}</span>
    <span class="front">${esc(c.f)}</span>
    ${v.flipped?`<span class="back">${esc(c.b)}</span>`:`<span class="tap">Überleg dir die Antwort, dann tippe zum Umdrehen</span>`}
  </button>
  ${v.flipped?`<div class="fcbtns"><button class="btn lg no-btn" id="no">Wusste ich nicht</button><button class="btn lg yes-btn" id="yes">Wusste ich</button></div>`:""}
  <div class="qfoot"><button class="btn" id="quit">Beenden</button><span class="kbd">Leertaste umdrehen · ← wusste ich nicht · → wusste ich</span></div>
  </div>`;
  app.querySelector("#card").onclick=()=>{v.flipped=!v.flipped; renderFlash();};
  if(v.flipped){app.querySelector("#no").onclick=()=>rateFlash(false); app.querySelector("#yes").onclick=()=>rateFlash(true);}
  app.querySelector("#quit").onclick=flashDone;
}
function rateFlash(ok){const v=view,c=v.items[v.i]; record(c.id,ok); save(); if(ok) v.known++; else v.missed.push(c);
  if(v.i+1<v.items.length){v.i++; v.flipped=false; renderFlash();} else flashDone();}
function flashDone(){
  const v=view; view=null;
  app.innerHTML=`<div class="view"><section class="result"><span class="eyebrow">Karteikarten · ${esc(v.title)}</span>
  <div class="score">${v.known}/${v.known+v.missed.length}</div>
  <p class="lead">${v.missed.length?`${v.missed.length} Karten wusstest du noch nicht. Geh sie gleich nochmal durch.`:"Alle gewusst. Jetzt die Aufgaben üben!"}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${v.missed.length?`<button class="btn solid" id="again">Nicht gewusste nochmal</button>`:""}<button class="btn" id="home">Zur Übersicht</button></div></section></div>`;
  scrollTo(0,0);
  app.querySelector("#home").onclick=home;
  const a=app.querySelector("#again"); if(a) a.onclick=()=>flash(v.missed,v.title);
}

/* ---------------- ÜBEN ---------------- */
function cardHTML(it,rv){
  const h=H[it.q.kind], st=status(it.q.id), t=TOPICS.find(x=>x.id===it.q.t);
  return `<div class="card ${rv?"locked":""}">
  <div class="qtop"><div class="qmeta"><span class="pill">${KINDS[it.q.kind]}</span><span class="dot" style="background:${COLORS[st]}"></span>${LABELS[st]} · ${t.title}</div>
  <p class="qtext">${esc(h.title(it))}</p><span class="hint">${h.hint(it)}</span></div>
  ${h.body(it,rv)}
  ${rv?feedbackHTML(it):""}</div>`;
}
function feedbackHTML(it){
  const h=H[it.q.kind], sc=h.score(it), ok=pass(it);
  if(it.q.kind==="write") return `<div class="feedback ${ok?"ok":sc>0?"part":"bad"}"><b>${ok?"Gut erklärt!":sc>0?"Teilweise.":"Da fehlt noch einiges."}</b>Du hast ${Math.round(sc*it.s.ticks.length)} von ${it.s.ticks.length} Punkten. Ab ${Math.ceil(it.s.ticks.length*2/3)} zählt die Aufgabe als richtig.</div>`;
  const ex=h.explain(it);
  return `<div class="feedback ${ok?"ok":sc>0?"part":"bad"}"><b>${ok?"Richtig!":sc>0?`Teilweise richtig (${Math.round(sc*100)} %).`:"Leider falsch."}</b>${ex}</div>`;
}
function practice(list,title,keepOrder){
  if(!list.length) return home();
  view={mode:"practice",title,items:(keepOrder?list:rankSort(list)).map(prepare),i:0,right:0};
  renderPractice();
}
function renderPractice(){
  const v=view, it=v.items[v.i], n=v.items.length, h=H[it.q.kind];
  app.innerHTML=`<div class="view">
  <div class="qhead"><span class="eyebrow">${esc(v.title)}</span><span class="big">Aufgabe ${v.i+1} / ${n} · ${v.right} richtig</span></div>
  <div class="prog"><span style="width:${(v.i+(it.checked?1:0))/n*100}%"></span></div>
  ${cardHTML(it,it.checked)}
  <div class="qfoot"><button class="btn" id="quit">Beenden</button><span class="kbd">${it.q.kind==="mc"?"A–D wählen · ":""}Enter prüfen/weiter</span>
  ${it.checked?`<button class="btn solid lg" id="next">${v.i+1<n?"Weiter":"Auswertung"}</button>`:`<button class="btn solid lg" id="check" ${h.ready(it)?"":"disabled"}>${it.q.kind==="write"?"Mit Musterlösung vergleichen":"Antwort prüfen"}</button>`}</div>
  </div>`;
  h.bind(it,renderPractice,()=>{});
  app.querySelector("#quit").onclick=()=>v.i>0||it.checked?practiceDone():home();
  const c=app.querySelector("#check"); if(c) c.onclick=checkPractice;
  const nx=app.querySelector("#next"); if(nx) nx.onclick=nextPractice;
  if(!it.checked&&fine){const f=app.querySelector(".gap,#calc-in,#w-in"); if(f) f.focus();}
}
function finalize(it){ if(it.checked&&!it.recorded){ it.recorded=true; const ok=pass(it); record(it.q.id,ok); if(ok&&view&&view.mode==="practice") view.right++; save(); } }
function checkPractice(){const it=view.items[view.i], h=H[it.q.kind]; if(it.checked||!h.ready(it)) return;
  it.checked=true; if(h.onCheck) h.onCheck(it); if(it.q.kind!=="write") finalize(it); renderPractice();}
function nextPractice(){ finalize(view.items[view.i]); if(view.i+1<view.items.length){view.i++; renderPractice(); scrollTo(0,0);} else practiceDone(); }
function practiceDone(){
  const v=view; v.items.forEach(finalize); view=null;
  const done=v.items.filter(x=>x.checked), wrong=done.filter(x=>!pass(x)), right=done.length-wrong.length;
  app.innerHTML=`<div class="view">
  <section class="result"><span class="eyebrow">${esc(v.title)} · Auswertung</span>
  <div class="score">${right}/${done.length}</div>
  <p class="lead">${done.length===0?"Du hast noch keine Aufgabe gelöst.":wrong.length?`${wrong.length} Aufgaben waren nicht ganz richtig. Sie landen unter „Fehler wiederholen“.`:"Alles richtig. Stark!"}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${wrong.length?`<button class="btn solid" id="again">Falsche nochmal üben</button>`:""}<button class="btn" id="home">Zur Übersicht</button></div></section>
  ${reviewHTML(wrong)}</div>`;
  scrollTo(0,0);
  app.querySelector("#home").onclick=home;
  const a=app.querySelector("#again"); if(a) a.onclick=()=>practice(wrong.map(x=>x.q),v.title+" · Fehler");
}
function reviewHTML(items){
  if(!items.length) return "";
  return `<span class="eyebrow">Das solltest du dir nochmal ansehen</span><div class="review">${items.map(it=>{const h=H[it.q.kind];
    return `<div class="rv"><p><span class="pill">${KINDS[it.q.kind]}</span> <b>${esc(h.title(it))}</b></p><p class="c">${h.solution(it)}</p>${it.q.kind==="mc"?`<p class="e">${esc(it.q.e)}</p>`:""}</div>`;}).join("")}</div>`;
}

/* ---------------- PRÜFUNG ---------------- */
function exam(){
  const per={t1:2,t2:2,t3:2,t4:2,t5:4,t6:2}; // 14 Ankreuzfragen, Schwerpunkt Thema 5
  let pick=[]; for(const t in per) pick=pick.concat(shuffle(QUESTIONS.filter(q=>q.t===t)).slice(0,per[t]));
  pick=pick.concat(shuffle(CLOZES).slice(0,4), shuffle(CALCS).slice(0,2));
  view={mode:"exam",items:shuffle(pick).map(prepare),i:0,confirm:false};
  renderExam();
}
function renderExam(){
  const v=view, it=v.items[v.i], n=v.items.length, h=H[it.q.kind], answered=v.items.filter(x=>H[x.q.kind].answered(x)).length;
  app.innerHTML=`<div class="view">
  <div class="qhead"><span class="eyebrow">Prüfungssimulation</span><span class="big" id="ex-count">${answered} / ${n} beantwortet</span></div>
  <div class="grid">${v.items.map((x,k)=>`<button data-go="${k}" class="${H[x.q.kind].answered(x)?"done":""} ${k===v.i?"cur":""}" aria-label="Aufgabe ${k+1}">${k+1}</button>`).join("")}</div>
  ${cardHTML(it,false)}
  <div class="qfoot"><button class="btn" id="prev" ${v.i?"":"disabled"}>Zurück</button>
  <button class="btn" id="submit">Abgeben</button>
  <button class="btn solid lg" id="next" ${v.i+1<n?"":"disabled"}>Weiter</button></div>
  ${v.confirm?`<div class="confirm"><span>${answered<n?`Noch ${n-answered} Aufgaben offen. `:""}Prüfung wirklich abgeben?</span><span style="display:flex;gap:8px"><button class="btn" id="cancel">Weiter bearbeiten</button><button class="btn solid" id="really">Abgeben</button></span></div>`:""}
  </div>`;
  h.bind(it,renderExam,()=>{const b=app.querySelector(`[data-go="${v.i}"]`); b.classList.toggle("done",h.answered(it));
    app.querySelector("#ex-count").textContent=`${v.items.filter(x=>H[x.q.kind].answered(x)).length} / ${n} beantwortet`;});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{v.i=+b.dataset.go;v.confirm=false;renderExam();});
  app.querySelector("#prev").onclick=()=>{if(v.i){v.i--;renderExam();}};
  app.querySelector("#next").onclick=()=>{if(v.i+1<n){v.i++;renderExam();}};
  app.querySelector("#submit").onclick=()=>{v.confirm=true;renderExam();};
  const c=app.querySelector("#cancel"); if(c) c.onclick=()=>{v.confirm=false;renderExam();};
  const r=app.querySelector("#really"); if(r) r.onclick=examDone;
}
function examDone(){
  const v=view; view=null;
  v.items.forEach(it=>record(it.q.id,pass(it)));
  const score=v.items.filter(pass).length, n=v.items.length, ok=score/n>=.8;
  S.exams.push({score,n,at:Date.now()}); save();
  const wrong=v.items.filter(x=>!pass(x));
  app.innerHTML=`<div class="view">
  <section class="result"><span class="eyebrow">Prüfungsergebnis</span>
  <span class="stamp ${ok?"pass":"fail"}">${ok?"Bestanden":"Nicht bestanden"}</span>
  <div class="score">${score}/${n}</div>
  <p class="lead">${Math.round(score/n*100)} % richtig. Zum Bestehen brauchst du mindestens ${Math.ceil(n*.8)} richtig gelöste Aufgaben.</p>
  <div class="grid" style="width:100%">${v.items.map((x,k)=>`<button disabled class="${pass(x)?"r":"w"}">${k+1}</button>`).join("")}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${wrong.length?`<button class="btn solid" id="again">Fehler üben</button>`:""}<button class="btn" id="new">Neue Prüfung</button><button class="btn" id="home">Zur Übersicht</button></div></section>
  ${reviewHTML(wrong)}</div>`;
  scrollTo(0,0);
  app.querySelector("#home").onclick=home;
  app.querySelector("#new").onclick=exam;
  const a=app.querySelector("#again"); if(a) a.onclick=()=>practice(wrong.map(x=>x.q),"Prüfungsfehler");
}

/* ---------------- TASTATUR ---------------- */
document.addEventListener("keydown",e=>{
  if(!view||e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=e.target.tagName, typing=tag==="INPUT"&&e.target.type!=="checkbox"||tag==="TEXTAREA", k=e.key.toLowerCase();
  if(view.mode==="fc"){
    if(k===" "&&tag!=="BUTTON"){view.flipped=!view.flipped;renderFlash();e.preventDefault();}
    else if(view.flipped&&(k==="arrowleft"||k==="arrowright")){rateFlash(k==="arrowright");e.preventDefault();}
    return;
  }
  const it=view.items[view.i];
  if(tag==="TEXTAREA") return;
  if(!typing && it.q.kind==="mc" && !it.checked){
    const idx="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);
    if(idx>=0&&idx<it.s.order.length){const ai=it.s.order[idx]; it.s.sel.has(ai)?it.s.sel.delete(ai):it.s.sel.add(ai);
      view.mode==="exam"?renderExam():renderPractice(); e.preventDefault(); return;}
  }
  if(k==="enter"&&view.mode==="practice"&&tag!=="BUTTON"){ it.checked?nextPractice():checkPractice(); e.preventDefault(); }
  else if(!typing&&view.mode==="exam"&&(k==="arrowright"||k==="arrowleft")){
    view.i=Math.max(0,Math.min(view.items.length-1,view.i+(k==="arrowright"?1:-1))); renderExam(); }
});
document.getElementById("home-btn").onclick=home;
document.getElementById("nav-home").onclick=home;
home();
</script>
